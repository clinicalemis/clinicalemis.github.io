<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><meta name="theme-color" content="#f4ede4">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<title>Página não encontrada | Clínica Lemis</title><meta name="robots" content="noindex">
<style>
:root{
  --bg: oklch(0.962 0.012 72);
  --surface: oklch(0.985 0.007 75);
  --nude: oklch(0.915 0.024 62);
  --nude-2: oklch(0.875 0.032 58);
  --ink: oklch(0.245 0.03 40);          /* marrom da logo */
  --ink-2: oklch(0.38 0.03 45);
  --muted: oklch(0.52 0.025 52);
  --caramel: oklch(0.6 0.07 55);
  --caramel-deep: oklch(0.44 0.055 45);
  --on-dark: oklch(0.975 0.01 75);
  --on-dark-2: oklch(0.975 0.01 75 / 0.78);
  --line: oklch(0.245 0.03 40 / 0.12);
  --line-dark: oklch(0.975 0.01 75 / 0.22);

  --r-out: 28px;
  --pad: clamp(20px, 2.2vw, 30px);
  --r-in: max(8px, calc(var(--r-out) - var(--pad)));
  --gap: clamp(14px, 1.6vw, 20px);

  --serif: "Gloock", Georgia, serif;
  --italic: "Playfair Display", Georgia, serif;
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100dvh}
a{color:inherit}
img{max-width:100%;display:block}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--caramel);outline-offset:3px;border-radius:6px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:var(--on-dark);padding:10px 14px;border-radius:10px;z-index:10;text-decoration:none}
.skip:focus{top:12px}

/* Cabeçalho */
.top{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 20px 22px}
.top .logo{width:clamp(120px,14vw,150px);height:auto;color:var(--ink)}
.top .tag{font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--caramel-deep);padding-left:.42em}

/* Grade */
.layout{max-width:1260px;margin:0 auto;padding:0 clamp(14px,2.4vw,28px) 28px;display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr) minmax(0,1.06fr) minmax(0,1fr);align-items:start}
.col{display:grid;gap:var(--gap);min-width:0}

.card{position:relative;border-radius:var(--r-out);padding:var(--pad);overflow:hidden;isolation:isolate;border:1px solid var(--line)}
.card h2{font:400 clamp(26px,2.3vw,32px)/1.05 var(--serif);margin:0 0 10px}
.card h2 em{font:italic 400 .95em var(--italic);color:var(--caramel)}
.card p{margin:0}
.eyebrow{font:italic 400 18px/1.1 var(--italic);color:var(--caramel-deep);margin-bottom:4px}

/* Herói */
.hero{position:sticky;top:20px;min-height:clamp(560px,calc(100dvh - 160px),780px);display:flex;flex-direction:column;justify-content:flex-end;color:var(--on-dark);border-color:transparent;
  background:linear-gradient(172deg in oklch, oklch(0.6 0.06 55) 0%, oklch(0.42 0.05 45) 52%, oklch(0.25 0.03 40) 100%)}
.hero-photo{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:70% 30%}
.hero:has(.hero-photo)::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg in oklch, oklch(0.8 0.06 70), oklch(0.67 0.07 60));mix-blend-mode:soft-light;opacity:.9}
.hero-photo + .hero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg in oklch, oklch(0.34 0.03 45 / 0.4) 0%, oklch(0.45 0.04 50 / 0) 16%, oklch(0.45 0.04 50 / 0) 34%, oklch(0.45 0.04 50 / 0.55) 58%, oklch(0.34 0.03 45 / 0.92) 100%)}
.hero-mark{position:absolute;z-index:-1;right:-8%;top:-4%;width:78%;height:auto;color:oklch(0.975 0.01 75 / 0.055)}
.hero .kicker{text-shadow:0 1px 8px oklch(0.2 0.03 40 / 0.5);display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--on-dark-2);margin-bottom:auto}
.hero .kicker::before{content:"";width:22px;height:1px;background:currentColor}
.hero h1{margin:0;font-family:var(--serif);font-weight:400;line-height:.95;letter-spacing:-.01em}
.hero h1 .l1{display:block;font:italic 400 clamp(26px,2.4vw,32px)/1 var(--italic);color:oklch(0.92 0.035 70)}
.hero h1 .l2{display:block;margin-top:4px;font-size:clamp(54px,5.6vw,76px);text-shadow:0 2px 18px oklch(0.3 0.03 45 / 0.35)}
.hero .lead{margin:16px 0 22px;max-width:34ch;color:var(--on-dark-2);font-size:15.5px}
.hero .lead strong{color:var(--on-dark);font-weight:600}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:999px;font:600 14.5px/1 var(--sans);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.btn-light{background:var(--on-dark);color:var(--ink)}
.btn-light:hover{background:var(--nude)}
.hero .btn-light{flex:1 1 auto}
.btn-dark{background:var(--ink);color:var(--on-dark)}
.btn-dark:hover{background:var(--caramel-deep)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:transparent}
.btn-ghost:hover{border-color:oklch(0.245 0.03 40 / 0.35)}
.round{width:48px;height:48px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--line-dark);color:var(--on-dark);text-decoration:none;transition:background-color .25s var(--ease)}
.round:hover{background:oklch(0.975 0.01 75 / 0.12)}
.round .ic{width:20px;height:20px}

/* Link de texto com seta */
.more{display:inline-flex;align-items:center;gap:10px;margin-top:18px;font-weight:600;font-size:14px;text-decoration:none;color:var(--caramel-deep);background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
.more .box{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:oklch(0.6 0.07 55 / 0.14);transition:transform .25s var(--ease)}
.more .ic{width:15px;height:15px}
.more:hover .box{transform:translate(2px,-2px)}

/* Card consultas */
.c-med{background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding:0;list-style:none}
.chips li{font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-2)}
.count{display:inline-flex;align-items:baseline;gap:6px;margin-top:4px;color:var(--muted);font-size:13px}
.count b{font:400 28px/1 var(--serif);color:var(--ink)}

/* Card estética */
.c-spa{color:var(--on-dark);border-color:transparent;background:linear-gradient(160deg in oklch, oklch(0.6 0.07 55), oklch(0.4 0.05 45))}
.c-spa .eyebrow{color:var(--on-dark-2)}
.c-spa p{color:var(--on-dark-2)}
.c-spa p strong{color:var(--on-dark);font-weight:600}
.c-spa .more{color:var(--on-dark)}
.c-spa .more .box{background:oklch(0.975 0.01 75 / 0.16)}
.c-spa .ring{position:absolute;z-index:-1;right:-70px;bottom:-90px;width:240px;height:240px;border-radius:50%;border:1px solid var(--line-dark)}
.c-spa .ring.r2{right:-20px;bottom:-140px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pair div{border-radius:var(--r-in);padding:12px 14px;background:oklch(0.975 0.01 75 / 0.1);border:1px solid var(--line-dark);font-size:13px;line-height:1.35}
.pair b{display:block;font:400 18px/1.15 var(--serif);margin-bottom:2px;color:var(--on-dark)}

/* Card Head Spa: foto à direita com camada de cor (mesmo tratamento dos cupons da Beatriz) */
.c-head{--c:0.34 0.03 45;min-height:220px;display:flex;flex-direction:column;justify-content:center;color:var(--on-dark);border-color:transparent;background:oklch(var(--c))}
.c-head-photo{position:absolute;right:0;top:0;bottom:0;z-index:-2;width:62%;height:100%;object-fit:cover;object-position:38% 40%}
.c-head::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg in oklch, oklch(var(--c)) 40%, oklch(var(--c) / 0.78) 60%, oklch(var(--c) / 0.3) 100%)}
.c-head::before{content:"";position:absolute;right:-50px;bottom:-60px;width:200px;height:200px;border-radius:50%;border:1.5px solid var(--line-dark);z-index:0}
.c-head-body{position:relative;width:72%}
.c-head .eyebrow{color:oklch(0.92 0.035 70)}
.c-head p{color:var(--on-dark-2)}
.c-head p strong{color:var(--on-dark);font-weight:700}
.c-head .more{color:var(--on-dark)}
.c-head .more .box{background:oklch(0.975 0.01 75 / 0.18)}

/* Card exames */
.c-exa{background:var(--nude)}
.c-exa p{color:var(--ink-2)}
.c-exa .ring{position:absolute;z-index:-1;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:oklch(0.975 0.01 75 / 0.45)}

/* Card localização */
.c-loc{background:var(--surface);padding:0;display:grid}
.c-loc .in{padding:var(--pad) var(--pad) 18px}
.c-loc address{font-style:normal;color:var(--ink-2)}
.c-loc address strong{color:var(--ink);font-weight:600}
.map{position:relative;margin:0 10px 10px;border-radius:calc(var(--r-out) - 10px);overflow:hidden;aspect-ratio:16/9;background:var(--nude)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:saturate(.75) sepia(.12)}
.loc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.loc-actions .btn{min-height:42px;padding:0 16px;font-size:13.5px}

/* Painel especialidades */
.panel{position:sticky;top:20px;background:var(--surface);display:flex;flex-direction:column;max-height:calc(100dvh - 40px)}
.panel header{text-align:center;padding-bottom:14px}
.panel h2{font-size:clamp(28px,2.4vw,32px)}
.panel header p{color:var(--muted);font-size:13.5px}
.search{position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:14px;top:50%;translate:0 -50%;color:var(--muted)}
.search input{width:100%;min-height:46px;border-radius:var(--r-in);border:1px solid var(--line);background:var(--bg);padding:0 14px 0 42px;font:500 14.5px var(--sans);color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--caramel);box-shadow:0 0 0 3px oklch(0.6 0.07 55 / 0.18)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font:600 12.5px var(--sans);color:var(--ink-2);cursor:pointer;transition:background-color .2s var(--ease),color .2s var(--ease)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--on-dark);border-color:var(--ink)}
.list-wrap{position:relative;min-height:0;flex:1;display:flex}
.list{list-style:none;margin:0;padding:4px 2px 18px;overflow:auto;flex:1;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 12px,#000 calc(100% - 28px),transparent)}
.svc + .svc{border-top:1px solid var(--line)}
.svc[hidden]{display:none}
.svc-link{display:grid;grid-template-columns:1fr auto;grid-template-areas:"txt go" "tag go";column-gap:12px;row-gap:6px;align-items:center;padding:13px 6px;text-decoration:none;border-radius:12px;transition:background-color .2s var(--ease)}
.svc-link:hover{background:var(--bg)}
.svc-txt{grid-area:txt;display:flex;flex-direction:column}
.svc-name{font:600 15px/1.25 var(--sans)}
.svc-desc{color:var(--muted);font-size:13px;line-height:1.4}
.svc-tag{grid-area:tag;justify-self:start;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--caramel-deep)}
.svc-go{grid-area:go;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:oklch(0.6 0.07 55 / 0.12);color:var(--caramel-deep);transition:background-color .2s var(--ease),color .2s var(--ease)}
.svc-go .ic{width:15px;height:15px}
.svc-link:hover .svc-go{background:var(--ink);color:var(--on-dark)}
.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:14px}
.panel .foot{border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.panel .foot a{font-weight:600;color:var(--ink);white-space:nowrap}

/* Rodapé */
.site-foot{max-width:1260px;margin:0 auto;padding:10px 24px 40px;text-align:center;font-size:12.5px;color:var(--muted);display:grid;gap:6px}
.site-foot nav{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px}
.site-foot a{text-decoration:none}
.site-foot a:hover{text-decoration:underline}

/* Responsivo */
@media (max-width:1099px){
  .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .col-hero{grid-column:1 / -1}
  .hero{position:relative;top:auto;min-height:clamp(440px,62dvh,560px)}
  .panel{position:relative;top:auto;max-height:none}
  .list{overflow:visible;-webkit-mask-image:none;mask-image:none}
}
@media (max-width:719px){
  body{font-size:14.5px}
  .top{padding:22px 16px 16px}
  .layout{grid-template-columns:minmax(0,1fr)}
  .hero{min-height:clamp(480px,78dvh,640px)}
  .hero-mark{width:96%;right:-22%}
  .pair{grid-template-columns:1fr}
  .col{display:contents}
  .c-loc{order:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.doc{max-width:720px;margin:0 auto 40px;padding:0 20px}.doc .card{background:var(--surface)}
.doc h1{font:400 clamp(32px,5vw,42px)/1.08 var(--serif);margin:0 0 6px}.doc h2{font-size:26px!important;margin:26px 0 6px!important}
.doc p,.doc li{color:var(--ink-2)}.doc a{color:var(--caramel-deep);font-weight:600}.back{display:inline-block;margin-top:24px}
.nf{text-align:center}.nf .big{font:400 96px/1 var(--serif);color:var(--caramel)}</style></head><body>
